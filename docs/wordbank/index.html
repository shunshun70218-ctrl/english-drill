<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="單字卡">
<title>多益單字卡</title>
<style>
/* 英文情境對話練習 — 樣式
 *
 * 色彩系統在編碼一件事：這是兩個人的對話，而其中一個是你。
 *   對方 = 深青 (--voice-a)    你 = 赭黃 (--voice-b)
 * 凡是「輪到你講」的東西一律赭黃：你的台詞、換你講的提示、等待你開口的進度條。
 * 英文內容用襯線體，介面中文用系統無襯線——正在學的語言跟操作介面分開。
 */

:root {
  --bg: #eaedec;
  --surface: #f8faf9;
  --surface-2: #dfe5e3;
  --line: #c9d3d0;
  --ink: #141f1d;
  --ink-soft: #4e5c59;
  --ink-faint: #7c8a87;

  --voice-a: #0f6a70;
  --voice-b: #8e5410;
  --accent: #0f6a70;
  --accent-soft: #d5e5e5;
  --you-soft: #f1e3ce;

  --shadow: 0 1px 2px rgba(20, 31, 29, .05), 0 4px 16px rgba(20, 31, 29, .06);
  --radius: 12px;

  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1615;
    --surface: #17201f;
    --surface-2: #202b29;
    --line: #2e3b39;
    --ink: #e3eae8;
    --ink-soft: #a2b0ad;
    --ink-faint: #74827f;

    --voice-a: #57c2c9;
    --voice-b: #e0a55e;
    --accent: #57c2c9;
    --accent-soft: #143033;
    --you-soft: #332619;

    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 16px rgba(0, 0, 0, .28);
  }
}

:root[data-theme="dark"] {
  --bg: #0f1615;
  --surface: #17201f;
  --surface-2: #202b29;
  --line: #2e3b39;
  --ink: #e3eae8;
  --ink-soft: #a2b0ad;
  --ink-faint: #74827f;

  --voice-a: #57c2c9;
  --voice-b: #e0a55e;
  --accent: #57c2c9;
  --accent-soft: #143033;
  --you-soft: #332619;

  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 16px rgba(0, 0, 0, .28);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.65 var(--sans);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 18px 16px 80px;
}

a { color: var(--accent); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- 頁首 ---------- */

.top { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }

.top__back {
  font-size: 14px;
  color: var(--ink-soft);
  text-decoration: none;
  align-self: flex-start;
}
.top__back:hover { color: var(--accent); }

.top__title {
  font-size: 25px;
  line-height: 1.25;
  margin: 0;
  letter-spacing: -.01em;
  text-wrap: balance;
}

.top__en {
  font-family: var(--serif);
  font-style: italic;
  color: var(--ink-soft);
  font-size: 16px;
  margin: 0;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  font-size: 13px;
  color: var(--ink-faint);
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}

.pill {
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 4px;
  padding: 2px 8px;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .02em;
}

/* ---------- 單元切換（線上版） ---------- */

.switcher {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-bottom: 16px;
  padding-bottom: 2px;
}
.switcher::-webkit-scrollbar { display: none; }

.switcher__btn {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-soft);
  font: inherit;
  font-size: 14px;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  min-height: 40px;
}
.switcher__btn[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
  font-weight: 600;
}

/* ---------- 關卡分頁 ---------- */

.tabs {
  display: flex;
  gap: 2px;
  background: var(--surface-2);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 18px;
  overflow-x: auto;
  scrollbar-width: none;
  position: sticky;
  top: 6px;
  z-index: 20;
  box-shadow: var(--shadow);
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 1 0 auto;
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  font: inherit;
  font-size: 14px;
  padding: 9px 11px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  min-height: 42px;
}
.tab b {
  font-variant-numeric: tabular-nums;
  color: var(--ink-faint);
  font-weight: 600;
  margin-right: 3px;
}
.tab[aria-selected="true"] {
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  box-shadow: var(--shadow);
}
.tab[aria-selected="true"] b { color: var(--accent); }

.panel { display: none; }
.panel.is-active { display: flex; flex-direction: column; gap: 14px; }

.panel__intro {
  color: var(--ink-soft);
  font-size: 14px;
  margin: 0;
}

/* ---------- 通用元件 ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}

.center { text-align: center; }

.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  min-height: 40px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.is-on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--surface);
  font-weight: 600;
}
.btn:disabled { opacity: .4; cursor: default; }

.btn--big {
  width: 100%;
  padding: 18px;
  font-size: 17px;
  font-weight: 600;
  border-radius: var(--radius);
  min-height: 56px;
}

.btn--play {
  padding: 0;
  width: 44px;
  min-width: 44px;
  height: 44px;
  min-height: 44px;
  font-size: 15px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.controls__label {
  font-size: 13px;
  color: var(--ink-faint);
}

.status {
  font-size: 14px;
  color: var(--ink-soft);
  min-height: 21px;
  margin: 0;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.bar {
  height: 5px;
  background: var(--surface-2);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 10px;
}
.bar__fill {
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: 999px;
}
.bar__fill--you { background: var(--voice-b); }

.hint {
  font-size: 13px;
  color: var(--ink-faint);
  text-align: center;
  margin: 0;
}

/* ---------- 1 盲聽 ---------- */

.blind__hint {
  text-align: center;
  color: var(--ink-soft);
  font-size: 15px;
  margin: 0;
}

.scene-box {
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 13px 15px;
  font-size: 15px;
}

/* ---------- 2 逐句對照 ---------- */

.line {
  display: grid;
  grid-template-columns: 62px 1fr;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.line:first-child { padding-top: 2px; }
.line:last-child { border-bottom: 0; padding-bottom: 2px; }
.line.is-current { background: var(--accent-soft); border-radius: 8px; padding-left: 8px; }

.line__role {
  font-size: 11px;
  font-weight: 700;
  padding-top: 6px;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.line__role--A { color: var(--voice-a); }
.line__role--B { color: var(--voice-b); }

.line__en {
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.5;
}
.line__zh { font-size: 14px; color: var(--ink-soft); margin-top: 3px; }
.line__zh[hidden] { display: none; }

.line__tools { display: flex; gap: 6px; margin-top: 8px; }

/* ---------- 3 單字卡 ---------- */

.words { display: grid; gap: 10px; }

.word__head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.word__term {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
}
.word__pos { font-size: 13px; color: var(--ink-faint); font-style: italic; }
.word__zh { font-size: 15px; color: var(--ink-soft); }

.word__ex {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
  align-items: center;
}
.word__ex-text { font-family: var(--serif); font-size: 16px; }
.word__ex-zh { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

/* ---------- 4 跟讀 / 5 角色扮演 ---------- */

.stage {
  min-height: 180px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 8px;
}
.stage__role {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.stage__en {
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1.45;
  text-wrap: balance;
}
.stage__zh { font-size: 15px; color: var(--ink-soft); }
.stage__cue {
  font-size: 14px;
  font-weight: 600;
  color: var(--voice-b);
  background: var(--you-soft);
  border-radius: 999px;
  padding: 4px 14px;
}
.stage__idle { color: var(--ink-faint); font-size: 15px; margin: 0; }

/* ---------- 提醒 ---------- */

.tips { margin-top: 26px; }
.tips h2 {
  font-size: 12px;
  margin: 0 0 10px;
  color: var(--ink-faint);
  letter-spacing: .06em;
  text-transform: uppercase;
  font-weight: 700;
}
.tips ul { margin: 0; padding-left: 20px; }
.tips li { margin-bottom: 8px; font-size: 15px; }

/* ---------- 總目錄頁 ---------- */

.units { display: grid; gap: 10px; }

.unit-card {
  display: block;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 15px 17px;
  text-decoration: none;
  color: inherit;
  box-shadow: var(--shadow);
}
.unit-card:hover { border-color: var(--accent); }
.unit-card__title { font-size: 17px; font-weight: 650; }
.unit-card__en {
  font-family: var(--serif);
  font-style: italic;
  font-size: 14px;
  color: var(--ink-faint);
  margin-top: 1px;
}
.unit-card__scene { font-size: 14px; color: var(--ink-soft); margin-top: 8px; }
.unit-card__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  font-size: 12px;
  color: var(--ink-faint);
  margin-top: 11px;
  font-variant-numeric: tabular-nums;
}
.unit-card__date { margin-left: auto; }

.empty { color: var(--ink-soft); }

.howto { margin-top: 28px; font-size: 14px; color: var(--ink-soft); }
.howto code {
  background: var(--surface-2);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 13px;
}

/* 單字卡專用樣式，疊在 player.css 之上。
 * 熟練度沿用同一套語意色：不會=赭黃（要練的東西都是赭黃）、有印象=中性、熟了=青。
 */

/* 帶文字的播放鈕：會自動撐寬，不像 .btn--play 是固定 44×44 的方形圖示鈕 */
.btn--audio {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 20px;
  height: 44px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 600;
}
.btn--audio .btn__icon { font-size: 12px; line-height: 1; }
.btn--audio:hover { background: var(--accent); border-color: var(--accent); color: var(--surface); }

.btn--play .btn__icon { line-height: 1; }

.mode-row { display: flex; gap: 6px; margin-bottom: 16px; }

.mode-btn {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-soft);
  font: inherit;
  font-size: 14px;
  padding: 10px;
  border-radius: 9px;
  cursor: pointer;
  min-height: 44px;
}
.mode-btn[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
  font-weight: 600;
}

/* ---------- 音節顯示 ---------- */

/* 單字本身：原樣呈現，不切開 */
.term {
  font-family: var(--serif);
  line-height: 1.2;
  text-wrap: balance;
}

.syls {
  font-family: var(--serif);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: center;
  gap: 2px;
  line-height: 1.25;
}
.syl { }

/* 重音節只用顏色標，不改大小寫、不加粗——字體一致，讀起來才不會跳。
 * 重音位置在音標裡也有 ˈ 記號，這裡是輔助不是唯一來源。 */
.syl--stress { color: var(--voice-a); }
.syl-dot {
  color: var(--ink-faint);
  font-size: .62em;
  padding: 0 .18em;
  transform: translateY(-.12em);
}

.ipa {
  font-family: var(--serif);
  color: var(--ink-soft);
  font-variant-numeric: normal;
}

/* ---------- 字卡 ---------- */

.fc { display: flex; flex-direction: column; gap: 14px; }

.fc__stats {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 12px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.fc__chip {
  border-radius: 999px;
  padding: 3px 10px;
  font-weight: 600;
}
.fc__chip--0 { background: var(--you-soft); color: var(--voice-b); }
.fc__chip--1 { background: var(--surface-2); color: var(--ink-soft); }
.fc__chip--2 { background: var(--accent-soft); color: var(--accent); }
.fc__remain { margin-left: auto; }

.fc__card {
  min-height: 300px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  cursor: pointer;
  padding: 26px 20px;
}
.fc__card .term { font-size: 34px; font-weight: 600; }
.fc__card .syls { font-size: 21px; color: var(--ink-soft); }

.fc__tap { font-size: 13px; color: var(--ink-faint); margin: 0; }

.fc__back {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}
.fc__back[hidden] { display: none; }

.fc__ipa { font-size: 18px; }
.fc__pos { font-size: 13px; color: var(--ink-faint); font-style: italic; margin-left: 8px; }
.fc__zh { font-size: 20px; font-weight: 600; }

.fc__ex {
  display: flex;
  gap: 10px;
  align-items: center;
  text-align: left;
  background: var(--surface-2);
  border-radius: 10px;
  padding: 11px 13px;
  width: 100%;
}
.fc__ex-en { font-family: var(--serif); font-size: 16px; }
.fc__ex-zh { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

.fc__levels { display: flex; gap: 8px; }
.fc__levels[hidden] { display: none; }

.lv {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  padding: 14px 8px;
  border-radius: 10px;
  cursor: pointer;
  min-height: 52px;
}
.lv small {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--ink-faint);
  margin-top: 2px;
}
.lv--0:hover { border-color: var(--voice-b); color: var(--voice-b); }
.lv--2:hover { border-color: var(--accent); color: var(--accent); }

.fc__done {
  text-align: center;
  color: var(--ink-soft);
  padding: 40px 0;
}

/* ---------- 列表 ---------- */

.wb-list { display: grid; gap: 10px; }

.wb-item { display: flex; gap: 12px; align-items: flex-start; }
.wb-item__body { flex: 1; min-width: 0; }
.wb-item .term { font-size: 20px; font-weight: 600; }
.wb-item .syls { justify-content: flex-start; font-size: 15px; }

.wb-item__breakdown {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  margin-top: 3px;
  font-size: 14px;
  color: var(--ink-soft);
}

.wb-item__zh { font-size: 15px; margin-top: 6px; }
.wb-item__pos { font-size: 12px; color: var(--ink-faint); font-style: italic; margin-left: 6px; }
.wb-item__ex {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
  display: flex;
  gap: 10px;
  align-items: center;
}

.lvdot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex: 0 0 auto;
  margin-top: 8px;
}
.lvdot--0 { background: var(--voice-b); }
.lvdot--1 { background: var(--ink-faint); }
.lvdot--2 { background: var(--accent); }
.lvdot--none { background: var(--line); }

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="top__back" href="../index.html">← 回目錄</a>
    <h1 class="top__title">多益單字卡</h1>
    <p class="top__en">TOEIC Vocabulary Flashcards</p>
    <div class="meta" id="bank-meta"></div>
  </header>
  <div id="app"></div>

bles": ["pol", "lute"], "stress": 1, "ipa": "pəˈlut", "audio": "audio/toeic-2000/lv20-71-w.m4a"}, {"term": "reschedule", "pos": "", "zh": "[計] 重安排、重調度", "example_en": "I need to reschedule our meeting for next week.", "tag": "toefl", "toeic": true, "syllables": ["res", "che", "dule"], "stress": 1, "ipa": "riˈskɛ.dʒul", "audio": "audio/toeic-2000/lv20-72-w.m4a"}, {"term": "headquarter", "pos": "v.", "zh": "將...的總部設在", "example_en": "The company's headquarter is located in New York.", "toeic": true, "syllables": ["head", "quar", "ter"], "stress": 0, "ipa": "ˈhɛdˌkwɔr.tər", "audio": "audio/toeic-2000/lv20-73-w.m4a"}, {"term": "rehearse", "pos": "v.", "zh": "預演、排演", "example_en": "They aren't quarreling, but are rehearsing a play.", "example_zh": "他們不是在打架，而是在排練戲劇。", "tag": "toefl gre", "toeic": true, "syllables": ["re", "hearse"], "stress": 1, "ipa": "riˈhɜrs", "audio": "audio/toeic-2000/lv20-74-w.m4a"}, {"term": "cheeseburger", "pos": "n.", "zh": "乾酪漢堡包", "example_en": "I ordered a cheeseburger for lunch.", "toeic": true, "syllables": ["cheese", "burg", "er"], "stress": 0, "ipa": "ˈtʃiz.bər.ɡər", "audio": "audio/toeic-2000/lv20-75-w.m4a"}, {"term": "freighter", "pos": "n.", "zh": "租船人、承運人", "example_en": "The freighter carried a load of cargo across the ocean.", "tag": "toefl", "toeic": true, "syllables": ["frei", "ghter"], "stress": 0, "ipa": "ˈfreɪ.tər", "audio": "audio/toeic-2000/lv20-76-w.m4a"}, {"term": "obligate", "pos": "v.", "zh": "使負義務、強使", "example_en": "The contract will obligate you to fulfill certain responsibilities.", "toeic": true, "syllables": ["ob", "li", "gate"], "stress": 0, "ipa": "ˈɑ.bləˌɡeɪt", "audio": "audio/toeic-2000/lv20-77-w.m4a"}, {"term": "raincoat", "pos": "n.", "zh": "雨衣", "example_en": "Who's the girl in a yellow raincoat?", "example_zh": "穿黃色雨衣的女孩是誰？", "tag": "zk gk ielts", "toeic": true, "syllables": ["rain", "coat"], "stress": 0, "ipa": "ˈreɪnˌkoʊt", "audio": "audio/toeic-2000/lv20-78-w.m4a"}, {"term": "videoconference", "pos": "n.", "zh": "視頻會議", "example_en": "I had a videoconference with my colleagues from different countries.", "toeic": true, "syllables": ["vi", "deo", "con", "fe", "rence"], "stress": 0, "ipa": "ˈvi.di.oʊˌkɑn.frəns", "audio": "audio/toeic-2000/lv20-79-w.m4a"}, {"term": "punctual", "pos": "adj.", "zh": "準時的、守時的", "example_en": "She doesn't like people who aren't punctual.", "example_zh": "她不喜歡不守時的人。", "tag": "gk cet4 cet6 ky toefl ielts", "toeic": true, "syllables": ["punc", "tu", "al"], "stress": 0, "ipa": "ˈpʌŋk.tʃu.əl", "audio": "audio/toeic-2000/lv20-80-w.m4a"}, {"term": "congratulation", "pos": "n.", "zh": "祝賀、恭喜", "example_en": "May I be the first to offer my congratulations.", "example_zh": "讓我來第一箇祝賀。", "tag": "gk cet4 cet6 ky toefl", "toeic": true, "syllables": ["con", "grat", "u", "la", "tion"], "stress": 3, "ipa": "kənˌɡræ.tʃəˈleɪ.ʃən", "audio": "audio/toeic-2000/lv20-81-w.m4a"}, {"term": "doorman", "pos": "n.", "zh": "看門人", "example_en": "The doorman greeted us with a warm smile as we entered the hotel.", "toeic": true, "syllables": ["door", "man"], "stress": 0, "ipa": "ˈdɔrˌmæn", "audio": "audio/toeic-2000/lv20-82-w.m4a"}, {"term": "penalize", "pos": "v.", "zh": "處刑、對...處罰(刑)", "example_en": "The referee decided to penalize the player for his rough tackle.", "tag": "gre", "toeic": true, "syllables": ["pe", "nal", "ize"], "stress": 0, "ipa": "ˈpɛ.nəˌlaɪz", "audio": "audio/toeic-2000/lv20-83-w.m4a"}, {"term": "stockbroker", "pos": "n.", "zh": "股票經紀人", "example_en": "I hired a stockbroker to manage my investments.", "toeic": true, "syllables": ["stock", "bro", "ker"], "stress": 0, "ipa": "ˈstɑkˌbroʊ.kər", "audio": "audio/toeic-2000/lv20-84-w.m4a"}, {"term": "inexperience", "pos": "n.", "zh": "無經驗、不熟練", "example_en": "Her inexperience showed when she made several mistakes on her first day of work.", "toeic": true, "syllables": ["in", "ex", "pe", "ri", "ence"], "stress": 2, "ipa": "ˌɪ.nɪkˈspɪ.ri.əns", "audio": "audio/toeic-2000/lv20-85-w.m4a"}, {"term": "businessperso <script>
/* 多益單字卡
 *
 * 資料由 make_wordbank.py 內嵌（含音節、音標、重音節、發音 data URI）。
 * 熟練度分三段存在 localStorage：0 不會 / 1 有印象 / 2 熟了。
 *
 * 抽卡用「回合制佇列」而不是加權隨機：一輪把所有『不會』與『有印象』的字全排進去，
 * 『熟了』的只隨機抽兩成複習。純加權隨機在字多的時候會被稀釋——95 個熟字各佔一份權重，
 * 就算不熟的字權重是六倍，也只有 6% 機率被抽到，等於沒有優先練到不會的。
 */

(() => {
  'use strict';

  const BANKS = JSON.parse(document.getElementById('bank-data').textContent);
  let BANK = BANKS[0];
  const LEVEL_KEY = 'wordbank:levels';
  const BANK_KEY = 'wordbank:bank';
  const LEVEL_NAMES = ['不會', '有印象', '熟了'];
  const REVIEW_RATIO = 0.2;      // 一輪裡「熟了」的字複習兩成
  const RETRY_GAP = 4;           // 標「不會」的字，本輪隔幾張後再出現一次

  const app = document.getElementById('app');

  /* ---------- 播放（共用同一個 audio 元素，iOS 才不會第一次之後靜音） ---------- */

  let sharedAudio = null;
  function play(src) {
    if (!src) return;
    if (!sharedAudio) {
      sharedAudio = new Audio();
      sharedAudio.preload = 'auto';
    }
    sharedAudio.pause();
    sharedAudio.src = src;
    sharedAudio.currentTime = 0;
    sharedAudio.play().catch(() => {});
  }

  /* ---------- 熟練度 ---------- */

  let levels = {};
  try { levels = JSON.parse(localStorage.getItem(LEVEL_KEY) || '{}'); } catch (e) { levels = {}; }

  const levelOf = (word) => {
    const value = levels[word.term.toLowerCase()];
    return typeof value === 'number' ? value : null;
  };

  function setLevel(word, value) {
    levels[word.term.toLowerCase()] = value;
    try { localStorage.setItem(LEVEL_KEY, JSON.stringify(levels)); } catch (e) { /* 忽略 */ }
  }

  /* ---------- 共用小元件 ---------- */

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };

  /** 單字本身，原樣不動 */
  function termView(word) {
    return el('div', 'term', word.term);
  }

  /** 音節拆解：con · fi · DEN · tial，重音節上色加粗 */
  function syllableView(word) {
    const box = el('div', 'syls');
    const parts = word.syllables && word.syllables.length ? word.syllables : [word.term];
    parts.forEach((part, i) => {
      if (i > 0) box.appendChild(el('span', 'syl-dot', '·'));
      box.appendChild(el('span', word.stress === i ? 'syl syl--stress' : 'syl', part));
    });
    return box;
  }

  /** 沒給 label 就是 44×44 的方形圖示鈕；給了 label 要用會自動撐寬的樣式，不然文字會爆出框外 */
  function playButton(src, label) {
    const btn = el('button', label ? 'btn btn--audio' : 'btn btn--play');
    btn.type = 'button';
    btn.appendChild(el('span', 'btn__icon', '▶'));
    if (label) btn.appendChild(el('span', null, label));
    btn.addEventListener('click', (event) => { event.stopPropagation(); play(src); });
    return btn;
  }

  /* ---------- 主題選擇 ---------- */

  let THEMES = [];
  let theme = null;
  let mode = 'card';

  const meta = document.getElementById('bank-meta');
  const bankRow = el('div', 'mode-row');
  const switcher = el('div', 'switcher');

  // 字庫切換（只有一個字庫就不顯示）
  const bankButtons = BANKS.map((item) => {
    const btn = el('button', 'mode-btn', item.title);
    btn.type = 'button';
    btn.addEventListener('click', () => selectBank(item));
    bankRow.appendChild(btn);
    return btn;
  });
  bankRow.hidden = BANKS.length < 2;

  function buildThemes() {
    const all = { slug: '__all', name: '全部', words: BANK.themes.flatMap((t) => t.words) };
    THEMES = [all, ...BANK.themes];
    theme = all;

    meta.innerHTML = '';
    meta.append(
      el('span', 'pill', BANK.title_en || 'TOEIC'),
      el('span', null, `${BANK.themes.length} 組`),
      el('span', null, `${all.words.length} 個單字`),
    );

    switcher.innerHTML = '';
    THEMES.forEach((item) => {
      const btn = el('button', 'switcher__btn', item.name);
      btn.type = 'button';
      btn.setAttribute('aria-pressed', item === theme ? 'true' : 'false');
      btn.addEventListener('click', () => {
        theme = item;
        Array.from(switcher.children).forEach((other, i) =>
          other.setAttribute('aria-pressed', THEMES[i] === item ? 'true' : 'false'));
        resetRound();    // 換組就重新排一輪，不然會停在別組的字上
        render();
      });
      switcher.appendChild(btn);
    });
  }

  function selectBank(item) {
    BANK = item;
    bankButtons.forEach((btn, i) => btn.setAttribute('aria-pressed', BANKS[i] === item ? 'true' : 'false'));
    try { localStorage.setItem(BANK_KEY, item.title); } catch (e) { /* 忽略 */ }
    buildThemes();
    resetRound();
    render();
  }

  const modeRow = el('div', 'mode-row');
  const modeButtons = [['card', '字卡'], ['list', '列表']].map(([key, label]) => {
    const btn = el('button', 'mode-btn', label);
    btn.type = 'button';
    btn.setAttribute('aria-pressed', key === mode ? 'true' : 'false');
    btn.addEventListener('click', () => {
      mode = key;
      modeButtons.forEach((other) => other.setAttribute('aria-pressed', other === btn ? 'true' : 'false'));
      render();
    });
    modeRow.appendChild(btn);
    return btn;
  });

  const view = el('div');
  app.append(bankRow, switcher, modeRow, view);

  /* ---------- 字卡 ---------- */

  let current = null;
  let flipped = false;
  let queue = [];
  let roundSize = 0;

  function shuffle(list) {
    const out = list.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  /** 一輪＝全部不熟的字 + 兩成已熟的字複習。 */
  function buildQueue(words) {
    const weak = words.filter((w) => (levelOf(w) ?? 0) === 0);
    const shaky = words.filter((w) => levelOf(w) === 1);
    const known = words.filter((w) => levelOf(w) === 2);
    const review = shuffle(known).slice(0, Math.round(known.length * REVIEW_RATIO));
    const round = shuffle([...weak, ...shaky, ...review]);
    return round.length ? round : shuffle(words);
  }

  function startRound() {
    queue = buildQueue(theme.words);
    roundSize = queue.length;
    current = queue.shift() || null;
    flipped = false;
  }

  function resetRound() {
    queue = [];
    roundSize = 0;
    current = null;
    flipped = false;
  }

  /** 標「不會」→ 本輪隔幾張後再考一次 */
  function requeue(word) {
    queue.splice(Math.min(RETRY_GAP, queue.length), 0, word);
    roundSize += 1;
  }

  function advance() {
    current = queue.shift() || null;
    flipped = false;
  }

  function renderCard() {
    const words = theme.words;
    view.innerHTML = '';
    if (!words.length) {
      view.appendChild(el('p', 'fc__done', '這個主題還沒有單字。'));
      return;
    }

    if (!current && queue.length === 0 && roundSize === 0) startRound();

    // 這一輪跑完了
    if (!current) {
      const done = el('div', 'fc');
      const stats = el('div', 'fc__stats');
      [0, 1, 2].forEach((lv) => {
        const count = words.filter((w) => levelOf(w) === lv).length;
        stats.appendChild(el('span', `fc__chip fc__chip--${lv}`, `${LEVEL_NAMES[lv]} ${count}`));
      });
      done.appendChild(stats);

      const box = el('div', 'card');
      const message = el('p', 'fc__done');
      const weak = words.filter((w) => (levelOf(w) ?? 0) === 0).length;
      message.textContent = weak
        ? `這輪練完了，還有 ${weak} 個字標著「不會」。再來一輪？`
        : '這輪練完了，沒有標著「不會」的字了 👏';
      box.appendChild(message);
      done.appendChild(box);

      const again = el('button', 'btn btn--big', '▶ 再來一輪');
      again.type = 'button';
      again.addEventListener('click', () => { startRound(); renderCard(); });
      done.appendChild(again);

      view.appendChild(done);
      return;
    }

    const wrap = el('div', 'fc');

    // 熟練度統計 + 本輪進度
    const stats = el('div', 'fc__stats');
    [0, 1, 2].forEach((lv) => {
      const count = words.filter((w) => levelOf(w) === lv).length;
      stats.appendChild(el('span', `fc__chip fc__chip--${lv}`, `${LEVEL_NAMES[lv]} ${count}`));
    });
    stats.appendChild(el('span', 'fc__remain', `本輪 ${roundSize - queue.length} / ${roundSize}`));
    wrap.appendChild(stats);

    // 卡片：正面只放原本的單字，音節拆解跟音標留到翻面才出現
    const card = el('div', 'card fc__card');
    card.appendChild(termView(current));
    card.appendChild(playButton(current.audio, '聽發音'));

    const back = el('div', 'fc__back');
    back.hidden = !flipped;
    back.appendChild(syllableView(current));
    if (current.ipa) back.appendChild(el('div', 'fc__ipa ipa', `/${current.ipa}/`));
    const zhRow = el('div');
    zhRow.appendChild(el('span', 'fc__zh', current.zh));
    if (current.pos) zhRow.appendChild(el('span', 'fc__pos', current.pos));
    back.appendChild(zhRow);

    if (current.example_en) {
      const ex = el('div', 'fc__ex');
      if (current.example_audio) ex.appendChild(playButton(current.example_audio));
      const body = el('div');
      body.appendChild(el('div', 'fc__ex-en', current.example_en));
      if (current.example_zh) body.appendChild(el('div', 'fc__ex-zh', current.example_zh));
      ex.appendChild(body);
      back.appendChild(ex);
    }
    card.appendChild(back);

    const tap = el('p', 'fc__tap', flipped ? '選一個熟練度，會自動換下一張' : '點卡片看答案');
    card.appendChild(tap);
    card.addEventListener('click', () => { if (!flipped) { flipped = true; renderCard(); } });
    wrap.appendChild(card);

    // 熟練度按鈕
    const levelRow = el('div', 'fc__levels');
    levelRow.hidden = !flipped;
    [0, 1, 2].forEach((lv) => {
      const btn = el('button', `lv lv--${lv}`);
      btn.type = 'button';
      btn.appendChild(document.createTextNode(LEVEL_NAMES[lv]));
      btn.appendChild(el('small', null, ['常常出現', '偶爾出現', '很少出現'][lv]));
      btn.addEventListener('click', () => {
        setLevel(current, lv);
        if (lv === 0) requeue(current);
        advance();
        renderCard();
      });
      levelRow.appendChild(btn);
    });
    wrap.appendChild(levelRow);

    view.appendChild(wrap);
  }

  /* ---------- 列表 ---------- */

  function renderList() {
    view.innerHTML = '';
    const list = el('div', 'wb-list');

    theme.words.forEach((word) => {
      const item = el('div', 'card wb-item');
      const lv = levelOf(word);
      item.appendChild(el('div', `lvdot lvdot--${lv === null ? 'none' : lv}`));
      item.appendChild(playButton(word.audio));

      const body = el('div', 'wb-item__body');
      body.appendChild(termView(word));
      const breakdown = el('div', 'wb-item__breakdown');
      breakdown.appendChild(syllableView(word));
      if (word.ipa) breakdown.appendChild(el('span', 'ipa', `/${word.ipa}/`));
      body.appendChild(breakdown);

      const zhRow = el('div', 'wb-item__zh');
      zhRow.appendChild(document.createTextNode(word.zh));
      if (word.pos) zhRow.appendChild(el('span', 'wb-item__pos', word.pos));
      body.appendChild(zhRow);

      if (word.example_en) {
        const ex = el('div', 'wb-item__ex');
        if (word.example_audio) ex.appendChild(playButton(word.example_audio));
        const exBody = el('div');
        exBody.appendChild(el('div', 'fc__ex-en', word.example_en));
        if (word.example_zh) exBody.appendChild(el('div', 'fc__ex-zh', word.example_zh));
        ex.appendChild(exBody);
        body.appendChild(ex);
      }

      item.appendChild(body);
      list.appendChild(item);
    });

    view.appendChild(list);
  }

  function render() {
    if (mode === 'card') renderCard();
    else renderList();
  }

  /* ---------- 鍵盤（桌機用） ---------- */

  document.addEventListener('keydown', (event) => {
    if (mode !== 'card' || !current) return;
    if (event.code === 'Space') {
      event.preventDefault();
      if (!flipped) { flipped = true; renderCard(); }
      else play(current.audio);
      return;
    }
    if (flipped && ['Digit1', 'Digit2', 'Digit3'].includes(event.code)) {
      event.preventDefault();
      const lv = Number(event.code.slice(-1)) - 1;
      setLevel(current, lv);
      if (lv === 0) requeue(current);
      advance();
      renderCard();
    }
  });

  // 記住上次選的字庫
  let startBank = BANKS[0];
  try {
    const saved = localStorage.getItem(BANK_KEY);
    const found = BANKS.find((b) => b.title === saved);
    if (found) startBank = found;
  } catch (e) { /* 忽略 */ }
  selectBank(startBank);
})();

</script>
</body>
