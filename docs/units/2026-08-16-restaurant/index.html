37}, {"role": "A", "en": "Sure. All together or separate?", "zh": "好的。一起付還是分開付？", "audio": "audio/line-15.m4a", "dur": 1.985}, {"role": "B", "en": "All together. Can I pay by card?", "zh": "一起付。可以刷卡嗎？", "audio": "audio/line-16.m4a", "dur": 2.314}, {"role": "A", "en": "Absolutely. I'll be right back.", "zh": "當然可以，我馬上回來。", "audio": "audio/line-17.m4a", "dur": 2.005}, {"role": "B", "en": "Thank you.", "zh": "謝謝。", "audio": "audio/line-18.m4a", "dur": 0.77}], "vocab": [{"term": "table for two", "pos": "phr.", "zh": "兩個人的位子", "example_en": "Table for two, please.", "example_zh": "兩位，謝謝。", "audio": "audio/word-01.m4a", "dur": 1.007, "example_audio": "audio/ex-01.m4a", "example_dur": 1.59}, {"term": "recommend", "pos": "v.", "zh": "推薦", "example_en": "What do you recommend?", "example_zh": "你推薦什麼？", "audio": "audio/word-02.m4a", "dur": 0.76, "example_audio": "audio/ex-02.m4a", "example_dur": 1.256}, {"term": "popular", "pos": "adj.", "zh": "受歡迎的", "example_en": "That dish is very popular.", "example_zh": "那道菜很受歡迎。", "audio": "audio/word-03.m4a", "dur": 0.681, "example_audio": "audio/ex-03.m4a", "example_dur": 1.531}, {"term": "side", "pos": "n.", "zh": "配菜", "example_en": "Which side would you like?", "example_zh": "您要哪一種配菜？", "audio": "audio/word-04.m4a", "dur": 0.546, "example_audio": "audio/ex-04.m4a", "example_dur": 1.244}, {"term": "check", "pos": "n.", "zh": "帳單（美式）", "example_en": "Could we get the check, please?", "example_zh": "可以買單嗎？", "audio": "audio/word-05.m4a", "dur": 0.467, "example_audio": "audio/ex-05.m4a", "example_dur": 1.74}, {"term": "separate", "pos": "adj.", "zh": "分開的（分開結帳）", "example_en": "We'd like separate checks.", "example_zh": "我們要分開結帳。", "audio": "audio/word-06.m4a", "dur": 0.627, "example_audio": "audio/ex-06.m4a", "example_dur": 1.453}, {"term": "all together", "pos": "phr.", "zh": "一起（結帳）", "example_en": "All together, please.", "example_zh": "一起結，謝謝。", "audio": "audio/word-07.m4a", "dur": 0.825, "example_audio": "audio/ex-07.m4a", "examp
