<script id="unit-data" type="application/json">{"slug": "airport-check-in", "title": "機場報到櫃檯", "title_en": "Checking In at the Airport", "level": "A2–B1", "date": "2026-08-16", "scene": "你在機場的航空公司櫃檯報到。要托運一件行李、確認沒有超重、劃一個靠走道的位子，最後問清楚登機門跟登機時間。", "roles": {"A": {"name": "Agent", "zh": "地勤人員", "voice": "Samantha", "rate": 155}, "B": {"name": "You", "zh": "旅客（你）", "voice": "Daniel", "rate": 155}}, "lines": [{"role": "A", "en": "Good morning. May I see your passport, please?", "zh": "早安，可以看一下您的護照嗎？", "audio": "audio/line-01.m4a", "dur": 2.976}, {"role": "B", "en": "Sure, here you go.", "zh": "好的，給你。", "audio": "audio/line-02.m4a", "dur": 1.533}, {"role": "A", "en": "Thank you. Are you checking any bags today?", "zh": "謝謝。今天有要托運行李嗎？", "audio": "audio/line-03.m4a", "dur": 2.637}, {"role": "B", "en": "Just the one. And I have a carry-on.", "zh": "就這一件。另外我有一件隨身行李。", "audio": "audio/line-04.m4a", "dur": 2.395}, {"role": "A", "en": "Please put your suitcase on the scale.", "zh": "請把行李箱放到磅秤上。", "audio": "audio/line-05.m4a", "dur": 1.96}, {"role": "B", "en": "Okay. Is it under the limit?", "zh": "好。有在重量上限內嗎？", "audio": "audio/line-06.m4a", "dur": 1.796}, {"role": "A", "en": "It's twenty-two kilos. That's fine, the limit is twenty-three.", "zh": "二十二公斤，沒問題，上限是二十三。", "audio": "audio/line-07.m4a", "dur": 3.758}, {"role": "B", "en": "Great. Could I get an aisle seat?", "zh": "太好了。可以幫我劃靠走道的位子嗎？", "audio": "audio/line-08.m4a", "dur": 2.127}, {"role": "A", "en": "Let me check. I have 24C available. Is that okay?", "zh": "我查一下。我這邊有 24C，可以嗎？", "audio": "audio/line-09.m4a", "dur": 3.801}, {"role": "B", "en": "That's perfect, thank you.", "zh": "太好了，謝謝。", "audio": "audio/line-10.m4a", "dur": 1.973}, {"role": "A", "en": "Here's your boarding pass. Your flight leaves from gate B12.", "zh": "這是您的登機證。您的班機在 B12 登機門。", "audio": "audio/line-11.m4a", "dur": 3.398}, {"role": "B", "en": "What time does boarding start?", "zh": "幾點開始登機？", "audio": "audio/line-12.m4a", "dur": 1.72}, {"role": "A", "en": "Boarding begins at ten forty, about an hour from now.", "zh": "十點四十開始登機，大概從現在算一個小時後。", "audio": "audio/line-13.m4a", "dur": 2.976}, {"role": "B", "en": "Got it. Where do I go through security?", "zh": "了解。安檢要往哪邊走？", "audio": "audio/line-14.m4a", "dur": 2.591}, {"role": "A", "en": "Straight ahead, then turn left. Have a nice flight!", "zh": "直走然後左轉。祝您旅途愉快！", "audio": "audio/line-15.m4a", "dur": 3.148}, {"role": "B", "en": "Thanks a lot.", "zh": "非常謝謝。", "audio": "audio/line-16.m4a", "dur": 0.887}], "vocab": [{"term": "passport", "pos": "n.", "zh": "護照", "example_en": "Please have your passport ready.", "example_zh": "請把護照準備好。", "audio": "audio/word-01.m4a", "dur": 0.751, "example_audio": "audio/ex-01.m4a", "example_dur": 1.577}, {"term": "check a bag", "pos": "phr.", "zh": "托運行李", "example_en": "I'd like to check one bag.", "example_zh": "我要托運一件行李。", "audio": "audio/word-02.m4a", "dur": 0.796, "example_audio": "audio/ex-02.m4a", "example_dur": 1.436}, {"term": "carry-on", "pos": "n.", "zh": "隨身行李", "example_en": "Your carry-on has to fit under the seat.", "example_zh": "你的隨身行李必須放得進座位下方。", "audio": "audio/word-03.m4a", "dur": 0.681, "example_audio": "audio/ex-03.m4a", "example_dur": 2.001}, {"term": "scale", "pos": "n.", "zh": "磅秤", "example_en": "Put your suitcase on the scale.", "example_zh": "把行李箱放到磅秤上。", "audio": "audio/word-04.m4a", "dur": 0.604, "example_audio": "audio/ex-04.m4a", "example_dur": 1.647}, {"term": "limit", "pos": "n.", "zh": "上限、限制", "example_en": "The weight limit is twenty-three kilos.", "example_zh": "重量上限是二十三公斤。", "audio": "audio/word-05.m4a", "dur": 0.478, "example_audio": "audio/ex-05.m4a", "example_dur": 1.928}, {"term": "aisle seat", "pos": "n.", "zh": "走道座位", "example_en": "I'd prefer an aisle seat, please.", "example_zh": "我比較想要走道的位子。", "audio": "audio/word-06.m4a", "dur": 0.772, "example_audio": "audio/ex-06.m4a", "example_dur": 2.097}, {"term": "window seat", "pos": "n.", "zh": "靠窗座位", "example_en": "Would you like a window seat instead?", "example_zh": "您要不要改成靠窗的位子？", "audio": "audio/word-07.m4a", "dur": 0.94, "example_audio": "audio/ex-07.m4a", "example_dur": 1.802}, {"term": "boarding pass", "pos": "n.", "zh": "登機證", "example_en": "Keep your boarding pass with you.", "example_zh": "登機證請隨身帶著。", "audio": "audio/word-08.m4a", "dur": 0.942, "example_audio": "audio/ex-08.m4a", "example_dur": 1.589}, {"term": "gate", "pos": "n.", "zh": "登機門", "example_en": "Our flight leaves from gate B12.", "example_zh": "我們的班機在 B12 登機門。", "audio": "audio/word-09.m4a", "dur": 0.42, "example_audio": "audio/ex-09.m4a", "example_dur": 1.877}, {"term": "go through security", "pos": "phr.", "zh": "過安檢", "example_en": "You need to go through security first.", "example_zh": "你要先過安檢。", "audio": "audio/word-10.m4a", "dur": 1.266, "example_audio": "audio/ex-10.m4a", "example_dur": 2.059}], "tips": ["aisle 的 s 不發音，唸 /aɪl/，聽起來跟 I'll 幾乎一樣。這是台灣人最常唸錯的機場單字。", "「托運」就講 check a bag，不要用 send 或 deliver —— 那是寄貨不是托運。", "座位 24C 要唸「twenty-four C」，不是一個一個唸「two four C」。", "Here you go. 是遞東西給對方時最順的一句，比 Give you 或 This is for you 自然太多。", "Just the one. 裡的 the 不是多餘的，它帶有「就只有這一件而已」的語氣，比 Just one 更道地。"], "total_dur": 39.7}</script>
