<script id="unit-data" type="application/json">{"slug": "coffee-shop-order", "title": "咖啡店點餐", "title_en": "Ordering at a Coffee Shop", "level": "A2–B1", "date": "2026-08-16", "scene": "你在一間咖啡店點一杯冰拿鐵，順便加點一個可頌。過程中要處理換燕麥奶要加價、內用還是外帶、以及留名字取餐。", "roles": {"A": {"name": "Barista", "zh": "咖啡師", "voice": "Samantha", "rate": 155}, "B": {"name": "You", "zh": "顧客（你）", "voice": "Daniel", "rate": 155}}, "lines": [{"role": "A", "en": "Hi there! What can I get for you?", "zh": "嗨！想喝點什麼？", "audio": "audio/line-01.m4a", "dur": 2.005}, {"role": "B", "en": "Could I have a medium latte, please?", "zh": "可以給我一杯中杯拿鐵嗎？", "audio": "audio/line-02.m4a", "dur": 2.37}, {"role": "A", "en": "Sure. For here or to go?", "zh": "好的。內用還是外帶？", "audio": "audio/line-03.m4a", "dur": 1.649}, {"role": "B", "en": "To go, please.", "zh": "外帶，謝謝。", "audio": "audio/line-04.m4a", "dur": 1.279}, {"role": "A", "en": "Hot or iced?", "zh": "熱的還是冰的？", "audio": "audio/line-05.m4a", "dur": 0.82}, {"role": "B", "en": "Iced, please. It's really warm today.", "zh": "冰的，謝謝。今天真的很熱。", "audio": "audio/line-06.m4a", "dur": 2.894}, {"role": "A", "en": "It is. Any milk alternatives?", "zh": "確實。要換別種奶嗎？", "audio": "audio/line-07.m4a", "dur": 2.017}, {"role": "B", "en": "Do you have oat milk?", "zh": "你們有燕麥奶嗎？", "audio": "audio/line-08.m4a", "dur": 1.268}, {"role": "A", "en": "We do, but it's fifty cents extra.", "zh": "有，不過要多五十分。", "audio": "audio/line-09.m4a", "dur": 2.22}, {"role": "B", "en": "That's fine. Oat milk, then.", "zh": "沒問題，那就燕麥奶。", "audio": "audio/line-10.m4a", "dur": 2.403}, {"role": "A", "en": "Anything to eat with that?", "zh": "要不要配點吃的？", "audio": "audio/line-11.m4a", "dur": 1.332}, {"role": "B", "en": "What's in the case there?", "zh": "那個櫃子裡有什麼？", "audio": "audio/line-12.m4a", "dur": 1.268}, {"role": "A", "en": "Croissants, muffins, and banana bread.", "zh": "可頌、瑪芬，還有香蕉蛋糕。", "audio": "audio/line-13.m4a", "dur": 2.634}, {"role": "B", "en": "I'll take a croissant, thanks.", "zh": "那給我一個可頌，謝謝。", "audio": "audio/line-14.m4a", "dur": 2.267}, {"role": "A", "en": "That'll be six twenty. Can I get a name?", "zh": "總共六塊二。可以留個名字嗎？", "audio": "audio/line-15.m4a", "dur": 2.39}, {"role": "B", "en": "It's Shun. That's S, H, U, N.", "zh": "Shun，S、H、U、N。", "audio": "audio/line-16.m4a", "dur": 3.498}, {"role": "A", "en": "Got it. It'll be ready at the end of the counter.", "zh": "好了。做好會放在櫃台那一頭。", "audio": "audio/line-17.m4a", "dur": 2.492}, {"role": "B", "en": "Great, thanks a lot.", "zh": "太好了，非常謝謝。", "audio": "audio/line-18.m4a", "dur": 1.581}], "vocab": [{"term": "medium", "pos": "adj.", "zh": "中杯的、中的", "example_en": "I'd like a medium coffee.", "example_zh": "我要一杯中杯咖啡。", "audio": "audio/word-01.m4a", "dur": 0.594, "example_audio": "audio/ex-01.m4a", "example_dur": 1.459}, {"term": "iced", "pos": "adj.", "zh": "冰的", "example_en": "One iced tea, please.", "example_zh": "一杯冰紅茶，謝謝。", "audio": "audio/word-02.m4a", "dur": 0.505, "example_audio": "audio/ex-02.m4a", "example_dur": 1.569}, {"term": "to go", "pos": "phr.", "zh": "外帶", "example_en": "One latte to go, please.", "example_zh": "一杯拿鐵外帶，謝謝。", "audio": "audio/word-03.m4a", "dur": 0.577, "example_audio": "audio/ex-03.m4a", "example_dur": 1.883}, {"term": "for here", "pos": "phr.", "zh": "內用", "example_en": "Is that for here or to go?", "example_zh": "這是內用還是外帶？", "audio": "audio/word-04.m4a", "dur": 0.557, "example_audio": "audio/ex-04.m4a", "example_dur": 1.367}, {"term": "oat milk", "pos": "n.", "zh": "燕麥奶", "example_en": "Can I get oat milk instead?", "example_zh": "可以改成燕麥奶嗎？", "audio": "audio/word-05.m4a", "dur": 0.676, "example_audio": "audio/ex-05.m4a", "example_dur": 1.625}, {"term": "extra", "pos": "adj.", "zh": "額外的、要加價的", "example_en": "Oat milk is fifty cents extra.", "example_zh": "燕麥奶要多五十分。", "audio": "audio/word-06.m4a", "dur": 0.564, "example_audio": "audio/ex-06.m4a", "example_dur": 1.851}, {"term": "croissant", "pos": "n.", "zh": "可頌", "example_en": "I'll take a croissant.", "example_zh": "我要一個可頌。", "audio": "audio/word-07.m4a", "dur": 0.692, "example_audio": "audio/ex-07.m4a", "example_dur": 1.204}, {"term": "case", "pos": "n.", "zh": "（食物的）展示櫃", "example_en": "What's in the case?", "example_zh": "櫃子裡有什麼？", "audio": "audio/word-08.m4a", "dur": 0.557, "example_audio": "audio/ex-08.m4a", "example_dur": 1.012}, {"term": "counter", "pos": "n.", "zh": "櫃台", "example_en": "Pick it up at the end of the counter.", "example_zh": "在櫃台那一頭取餐。", "audio": "audio/word-09.m4a", "dur": 0.576, "example_audio": "audio/ex-09.m4a", "example_dur": 1.727}, {"term": "order", "pos": "n.", "zh": "點的餐、訂單", "example_en": "Your order will be ready soon.", "example_zh": "你點的東西很快就好。", "audio": "audio/word-10.m4a", "dur": 0.467, "example_audio": "audio/ex-10.m4a", "example_dur": 1.502}], "tips": ["店員一定會問 For here or to go?（內用還是外帶），這句要能秒答，不用聽完整句才反應。", "croissant 重音在後面，唸 /krəˈsɑːnt/，不是照中文「可頌」的節奏唸。", "六塊二就唸 six twenty，母語人士不會唸成 six point two zero dollars。", "點餐用 Could I have… / I'll take… / Can I get…，不要用 I want —— I want 在櫃台聽起來很硬。", "medium 在飲料店就是中杯，不用畫蛇添足講 medium size。"], "total_dur": 36.4}</script>
